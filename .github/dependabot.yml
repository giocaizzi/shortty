version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7: blocked until astro/typescript-eslint/ts-jest support it — see issue #37
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
