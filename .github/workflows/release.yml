name: Release

# release-please keeps a Release PR open on main; merging it tags vX.Y.Z and
# creates the GitHub Release. The build job then attaches the installers under
# fixed names, so releases/latest/download/<name> always serves the newest one
# (README download badges). Run it by hand (workflow_dispatch) to get the
# installers as workflow artifacts without releasing.
# Runbook: docs/runbooks/release.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The app token (not GITHUB_TOKEN) makes the Release PR trigger CI, so its
      # required checks can pass.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.name }})
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make make
      - name: Name installers for stable download links
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = macOS ]; then
            cp out/make/dmg/*/Shortty-*.dmg dist/Shortty-macOS-arm64.dmg
            cp out/make/zip/darwin/*/Shortty-darwin-*.zip dist/Shortty-macOS-arm64.zip
          else
            cp out/make/squirrel.windows/x64/*Setup.exe dist/Shortty-Windows-x64-Setup.exe
            cp out/make/zip/win32/x64/Shortty-win32-*.zip dist/Shortty-Windows-x64.zip
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: Shortty-${{ matrix.name }}
          path: dist/*
      - name: Attach to the GitHub Release
        if: needs.release-please.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
