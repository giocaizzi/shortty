name: Release

# release-please keeps a Release PR open on main; merging it tags vX.Y.Z and
# creates the GitHub Release. The build job then attaches the installers under
# fixed names, so releases/latest/download/<name> always serves the newest one
# (README download badges). Run it by hand (workflow_dispatch) to get the
# installers as workflow artifacts without releasing.
# Runbook: docs/runbooks/release.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # SignPath's GitHub connector downloads the unsigned artifacts of the run.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The app token (not GITHUB_TOKEN) makes the Release PR trigger CI, so its
      # required checks can pass.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.name }})
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            arch: arm64
          # Intel Macs: cross-built on the same Apple silicon runner (no
          # runtime native modules), smoke-tested under Rosetta.
          - name: macOS Intel
            os: macos-latest
            arch: x64
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Signing secrets live in this environment (docs/runbooks/release.md).
    environment: release
    env:
      # Windows signs through SignPath only on a real release (each request
      # needs a manual approval) and when the token and organization are set;
      # manual runs and unconfigured builds are unsigned, like a local one.
      SIGNPATH_ENABLED: ${{ matrix.name == 'Windows' && needs.release-please.outputs.created == 'true' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: make install
      # Without the secrets the macOS build is unsigned, like a local one.
      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "::warning::MACOS_CERT_P12 not set: unsigned macOS build"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
      # Squirrel packs the app exe into the .nupkg and Setup.exe, so on Windows
      # the exe is signed between `make package` and `make make FROM_PACKAGE=1`.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          make package
          if [ "$SIGNPATH_ENABLED" != true ]; then echo "::warning::Not a release or SignPath not configured: unsigned Windows build"; fi
      - name: Upload the app exe for signing (Windows)
        id: unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-exe
          path: out/Shortty-win32-x64/shortty.exe
          if-no-files-found: error
          retention-days: 1
      # Waits for an approver to approve the request in SignPath.
      - name: Sign the app exe with SignPath (Windows)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'shortty' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app-exe
      - name: Put the signed app exe back (Windows)
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp signed-app-exe/shortty.exe out/Shortty-win32-x64/shortty.exe
      - run: make make ARCH=${{ matrix.arch }} ${{ runner.os == 'Windows' && 'FROM_PACKAGE=1' || '' }}
        env:
          # forge.config.ts signs the app and the DMG when the identity is set
          # and notarizes (and staples) both when all four are set.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Install Rosetta (macOS Intel)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Launch the packaged app (smoke test)
        env:
          # The first launch under Rosetta translates the app first.
          SMOKE_TIMEOUT_MS: ${{ matrix.arch == 'x64' && runner.os == 'macOS' && '300000' || '' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/smoke-packaged.mjs; else node scripts/smoke-packaged.mjs; fi
      - name: Verify the signature (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$(find out -maxdepth 3 -name Shortty.app -print -quit)"
          dmg="$(find out/make/dmg -name 'Shortty-*.dmg' -print -quit)"
          details="$(codesign -dvv "$app" 2>&1 || true)"
          if codesign --verify --deep --strict "$app" 2>/dev/null && grep -q 'Authority=Developer ID' <<<"$details"; then
            spctl --assess --type execute -vv "$app"
            codesign --verify --strict -vv "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          else
            echo "::warning::macOS build is not Developer ID signed"
          fi
      - name: Name installers for stable download links
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = macOS ]; then
            # update.electronjs.org serves the zip without "-arm64" to Intel Macs
            # (docs/runbooks/updates.md): keep these names.
            cp out/make/dmg/*/Shortty-*.dmg "dist/Shortty-macOS-$ARCH.dmg"
            cp out/make/zip/darwin/*/Shortty-darwin-*.zip "dist/Shortty-macOS-$ARCH.zip"
          elif [ "$RUNNER_OS" = Windows ]; then
            cp out/make/squirrel.windows/x64/*Setup.exe dist/Shortty-Windows-x64-Setup.exe
            cp out/make/zip/win32/x64/Shortty-win32-*.zip dist/Shortty-Windows-x64.zip
            # The Squirrel update feed (update.electronjs.org) reads these as built.
            cp out/make/squirrel.windows/x64/RELEASES out/make/squirrel.windows/x64/*.nupkg dist/
          else
            cp out/make/deb/x64/*.deb dist/Shortty-Linux-x64.deb
            cp out/make/rpm/x64/*.rpm dist/Shortty-Linux-x64.rpm
          fi
          ls -l dist
      # Setup.exe is signed after Squirrel built it; the .nupkg and RELEASES
      # (update feed) already hold the signed app exe and do not change.
      - name: Upload Setup.exe for signing (Windows)
        id: unsigned-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-exe
          path: dist/Shortty-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Setup.exe with SignPath (Windows)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'shortty' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: setup-exe
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup-exe
      - name: Put the signed Setup.exe back (Windows)
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp signed-setup-exe/Shortty-Windows-x64-Setup.exe dist/Shortty-Windows-x64-Setup.exe
      - name: Verify the signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in 'out/Shortty-win32-x64/shortty.exe', 'dist/Shortty-Windows-x64-Setup.exe') {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -eq 'NotSigned' -and $env:SIGNPATH_ENABLED -ne 'true') {
              Write-Output "::warning::$file is not signed"
            } elseif ($sig.Status -ne 'Valid') {
              throw "${file}: signature $($sig.Status): $($sig.StatusMessage)"
            } elseif (-not $sig.TimeStamperCertificate) {
              throw "${file}: signed but not timestamped"
            } else {
              Write-Output "${file}: signed by $($sig.SignerCertificate.Subject)"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Shortty-${{ matrix.name }}
          path: dist/*
      - name: Attach to the GitHub Release
        if: needs.release-please.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
