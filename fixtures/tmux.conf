# tmux configuration
set -g mouse on
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation, repeatable resize
bind h select-pane -L
bind j select-pane -D
bind -r H resize-pane -L 5
bind-key -r -T prefix K resize-pane -U 5

# Root table (no prefix)
bind -n M-Left select-pane -L
bind-key -n C-S-Right next-window

# Escaped / quoted keys
bind \; last-pane
bind '#' list-buffers

# Notes and custom tables
bind-key -N "Reload config" r source-file ~/.tmux.conf \; display "Reloaded"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T resize h resize-pane -L
bind -n MouseDown3Pane display-menu
